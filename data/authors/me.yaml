bio: |
  Dr. Snigdha Sen is an Assistant Professor (Senior Scale) in the School of
  Computer Engineering at Manipal Institute of Technology Bengaluru, MAHE.
  Her research applies deep learning and data science to large scientific
  datasets, with a focus on astronomical data analysis such as photometric
  redshift estimation. She is a life member of the Computer Society of India.

