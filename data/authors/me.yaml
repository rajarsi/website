bio: |
  Dr. Snigdha Sen is a Senior Assistant Professor in the School of Computer
  Engineering at Manipal Institute of Technology Bengaluru, MAHE, with around
  16 years of teaching experience. Before joining Manipal she was an Associate
  Professor at Global Academy of Technology, Bengaluru. She holds a PhD from
  IIIT Allahabad, an M.Tech in Information Technology from Jadavpur University
  and a B.E. from UIT, University of Burdwan. Her research spans
  astroinformatics, deep learning, computer vision, explainable AI for space
  science and big data analytics. She has published over 40 SCI- and
  Scopus-indexed papers and is a life member of the Computer Society of India.

