{{/* Site brand: EB Garamond headings + navy/saffron palette, shared with the CV and speaker profile. */}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--sen-navy:#1E2D47;--sen-navy-2:#2E4062;--sen-ink:#1F2A3A;--sen-body:#2E3A4B;--sen-muted:#4A5568;--sen-saffron:#E9A848;--sen-clay:#B4482A;--sen-cream:#FBF8F3;--sen-sand:#F3ECE1;--sen-line:#E8E1D6;--sen-mist:#B9C7DA}
body{font-family:'Public Sans',ui-sans-serif,system-ui,sans-serif;background:var(--sen-cream)}
h1,h2,h3,.font-serif{font-family:'EB Garamond',Georgia,serif}

/* Navy header and footer on every page */
#site-header,#site-header .navbar{background:var(--sen-navy)!important}
#site-header .navbar-brand{font-family:'EB Garamond',Georgia,serif;font-size:24px;font-weight:600;color:#FBF7F0!important}
#site-header .nav-link,#site-header button,#site-header label{color:#E3E9F1!important}
#site-header .nav-link:hover,#site-header .nav-link.active{color:var(--sen-saffron)!important}
.page-footer{background:var(--sen-navy)}
.page-footer footer{margin-top:0!important;padding-top:24px;padding-bottom:28px;color:#B9C7DA!important}
.page-footer a{color:#E3E9F1}
.page-footer a:hover{color:var(--sen-saffron)}
/* the home page's contact band sits directly on the footer */
.sh-contact{margin-bottom:0}

/* ---------- Home page ---------- */
.sh [id],#about,#research,#publications,#contact{scroll-margin-top:88px}
.sh{color:var(--sen-ink)}
.sh *{box-sizing:border-box}
.sh p{margin:0}
.sh-wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px}
.sh-eyebrow{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--sen-clay);margin-bottom:10px!important}
.sh-h2{margin:0;font-family:'EB Garamond',Georgia,serif;font-size:42px;font-weight:600;line-height:1.1;color:var(--sen-navy)}

.sh-hero{background:var(--sen-navy);overflow:hidden}
.sh-hero .sh-wrap{display:flex;flex-wrap:wrap;align-items:stretch;gap:48px}
.sh-hero-text{flex:1 1 520px;padding:88px 0 96px;display:flex;flex-direction:column;gap:22px}
.sh-hero-eyebrow{font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--sen-saffron)}
.sh-hero h1{margin:0;font-size:76px;font-weight:600;line-height:1.02;color:#FBF7F0}
.sh-role{font-size:21px;font-weight:600;color:#FBF7F0}
.sh-aff{font-size:17px;color:var(--sen-mist);margin-top:6px!important}
.sh-statement{max-width:560px;font-size:18px;line-height:1.65;color:#DCE4EE;margin-top:8px!important}
.sh-buttons{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
.sh-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;font-weight:700;font-size:16px;border-radius:10px;text-decoration:none!important;transition:transform .2s,background .2s}
.sh-btn:hover{transform:translateY(-2px)}
.sh-btn-primary{background:var(--sen-saffron);color:var(--sen-navy)!important}
.sh-btn-primary:hover{background:#F2B85E}
.sh-btn-outline{border:2px solid var(--sen-saffron);color:#FBF7F0!important}
.sh-btn-outline:hover{background:rgba(233,168,72,.12)}
.sh-links{display:flex;flex-wrap:wrap;gap:22px;margin-top:14px}
.sh-links a{color:var(--sen-mist);font-size:14px;font-weight:600;text-decoration:none;border-bottom:1px solid #4A5F82;padding-bottom:3px}
.sh-links a:hover{color:var(--sen-saffron);border-color:var(--sen-saffron)}
.sh-portrait{flex:0 1 460px;min-width:300px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.sh-portrait::before{content:"";position:absolute;left:20px;right:20px;top:64px;bottom:0;background:#FFFBFF;border-radius:230px 230px 0 0}
.sh-portrait img{position:relative;width:420px;max-width:100%;height:560px;object-fit:cover;object-position:center 12%;border-radius:210px 210px 0 0}

.sh-glance{background:var(--sen-sand);border-bottom:1px solid #E4DCCF}
.sh-glance .sh-wrap{padding-top:36px;padding-bottom:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px}
.sh-stat-v{font-family:'EB Garamond',Georgia,serif;font-size:52px;font-weight:600;line-height:1;color:var(--sen-clay)}
.sh-stat-l{font-size:15px;color:var(--sen-muted);margin-top:4px!important}

.sh-about{padding-top:88px;padding-bottom:24px;display:flex;flex-wrap:wrap;gap:48px}
.sh-about-h{flex:1 1 260px}
.sh-about-t{flex:2 1 520px;display:flex;flex-direction:column;gap:16px;font-size:17px;line-height:1.75;color:var(--sen-body)}

.sh-section{padding-top:88px;padding-bottom:24px}
.sh-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:36px}
.sh-more{font-weight:700;font-size:15px;color:#1E3A5F}
.sh-cards4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}
.sh-cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.sh-card{background:#fff;border:1px solid var(--sen-line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.sh-card svg{display:block;width:100%;height:150px}
.sh-card-b{padding:22px 22px 26px;display:flex;flex-direction:column;gap:10px}
.sh-card h3{margin:0;font-size:25px;font-weight:600;color:var(--sen-navy)}
.sh-card-t{font-size:15px;line-height:1.6;color:var(--sen-muted)}
.sh-pub{padding:26px;gap:12px}
.sh-pub-venue{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--sen-clay)}
.sh-pub h3{font-size:23px;line-height:1.25}
.sh-pub h3 a{color:var(--sen-navy);text-decoration:none}
.sh-pub h3 a:hover{color:var(--sen-clay)}
.sh-pub-auth{font-size:14px;color:#5A6474}
.sh-pub-auth b{color:var(--sen-navy)}
.sh-pub-links{display:flex;gap:10px;margin-top:auto;padding-top:8px}
.sh-pub-links a{font-size:13px;font-weight:700;padding:7px 12px;border:1px solid #C9D3E1;border-radius:8px;text-decoration:none;color:#1E3A5F}
.sh-pub-links a:hover{border-color:var(--sen-clay);color:var(--sen-clay)}

.sh-hl{padding:28px;gap:14px}
.sh-hl h3{font-family:'Public Sans',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--sen-clay)}
.sh-hl p{font-size:16px;line-height:1.6;color:var(--sen-body)}
.sh-hl.dark{background:var(--sen-navy);border-color:var(--sen-navy)}
.sh-hl.dark h3{color:var(--sen-saffron)}
.sh-hl.dark p{color:#F6F1E9}

.sh-contact{background:var(--sen-navy);margin-top:72px}
.sh-contact .sh-wrap{padding-top:56px;padding-bottom:48px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px}
.sh-contact h2{margin:0;font-size:30px;font-weight:600;color:#FBF7F0}
.sh-contact p{font-size:16px;color:var(--sen-mist);line-height:1.6}
.sh-contact a{font-size:17px;font-weight:600;color:var(--sen-saffron)}

@media (max-width:640px){
  .sh-hero-text{padding:56px 0 24px}
  .sh-hero h1{font-size:52px}
  .sh-h2{font-size:34px}
  .sh-portrait img{height:440px}
  .sh-stat-v{font-size:44px}
  .sh-about,.sh-section{padding-top:64px}
}
</style>
